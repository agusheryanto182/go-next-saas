<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Reset your password</title></head>
<body style="font-family: sans-serif; line-height: 1.5; color: #111;">
<p>{{if .FullName}}Hi {{.FullName}},{{else}}Hi,{{end}}</p>
<p>Someone asked to reset the password of your account. To choose a new password, open this link:</p>
<p><a href="{{.Link}}">Reset your password</a></p>
<p>The link is valid for 1 hour. If you did not ask for this, ignore this email: your password stays as it is.</p>
</body>
</html>
