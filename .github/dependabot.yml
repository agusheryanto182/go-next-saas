# Dependency updates (AGENTS.md rule 10): weekly, one grouped pull request per
# ecosystem and directory. Cooldown delays new releases by 14 days; security
# updates are not delayed by cooldown.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Jakarta"
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "area:infra"
      - "type:chore"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "gomod"
