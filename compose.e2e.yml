# Overrides for `make e2e` only (with its own project name, see the Makefile): random host ports,
# so a run never collides with `make dev` (fixed ports) or with a run from another worktree.
services:
  postgres:
    ports: !reset []
  mailpit:
    ports: !override
      - "127.0.0.1::8025"
  api:
    ports: !override
      - "127.0.0.1::8080"
  web:
    ports: !override
      - "127.0.0.1::3000"
