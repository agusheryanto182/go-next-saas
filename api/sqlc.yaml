# SQL in queries/ → typed Go in internal/repo/persistent/gen (ADR 0009). Run `make gen`.
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: queries
    strict_function_checks: true
    gen:
      go:
        package: gen
        out: internal/repo/persistent/gen
        sql_package: pgx/v5
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
