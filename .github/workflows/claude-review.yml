# Automatic pull request review with the official code-review plugin: parallel review agents check
# CLAUDE.md/AGENTS.md rules and look for bugs; only high-confidence findings are posted as a comment.
# Not a required check. Pull requests from forks are skipped by the action.
name: Claude review

on:
  pull_request:
    # Once per pull request: when it opens ready for review, or leaves draft.
    # Ask for another review with "@claude review" (claude.yml).
    types: [opened, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Dependency bumps from Dependabot are covered by CI; bots cannot start the action anyway,
    # and Dependabot runs do not get repository secrets.
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: false
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The plugin's own tool list: read the pull request, post comments. Nothing else.
          claude_args: |
            --permission-mode default
            --allowedTools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),mcp__github_inline_comment__create_inline_comment"
