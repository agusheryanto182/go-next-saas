# Local development stack.
#   make dev                       → PostgreSQL + Mailpit
#   docker compose --profile app up → plus the API and web app (added with their skeletons)
name: go-next-saas

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-saas}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-saas_owner}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-saas_app}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./dev/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    # Catches every email locally (nothing is really sent). Inbox: http://localhost:8025
    image: axllent/mailpit:v1.33.1
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  api:
    profiles: [app]
    build: ./api
    environment:
      DATABASE_URL: postgres://saas_app:${POSTGRES_APP_PASSWORD:-saas_app}@postgres:5432/${POSTGRES_DB:-saas}?sslmode=disable
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: [app]
    build: ./web
    environment:
      API_INTERNAL_URL: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
